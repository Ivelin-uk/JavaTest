spring.application.name=hello-world-spring
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/testdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=4000&socketTimeout=15000}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.db.startup.max-retries=${DB_STARTUP_MAX_RETRIES:15}
app.db.startup.retry-delay-ms=${DB_STARTUP_RETRY_DELAY_MS:1000}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:System Admin}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin12345}
