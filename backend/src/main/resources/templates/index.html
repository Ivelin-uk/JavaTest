<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Users</title>
    <style>
        :root {
            --bg: #f6f8fc;
            --card: #ffffff;
            --text: #1f2a44;
            --muted: #66708a;
            --accent: #0f766e;
            --danger: #be123c;
            --border: #dde3ee;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #ecf2ff, var(--bg));
            color: var(--text);
        }
        .container {
            max-width: 1080px;
            margin: 0 auto;
            display: grid;
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(24, 39, 75, 0.1);
            padding: 1.25rem;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        h2 {
            margin-top: 0;
        }
        p {
            margin: 0.5rem 0 0;
            color: var(--muted);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 0.6rem;
            margin-top: 0.8rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 0.55rem 0.65rem;
            border-radius: 8px;
            border: 1px solid #c8d3e2;
            background: #fff;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 0.55rem 0.85rem;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--accent);
        }
        .btn-danger {
            background: var(--danger);
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th,
        .table td {
            border-bottom: 1px solid var(--border);
            padding: 0.6rem;
            text-align: left;
            vertical-align: top;
        }
        .msg {
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
        }
        .msg-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .msg-error {
            background: #ffe4e6;
            color: #9f1239;
            border: 1px solid #fecdd3;
        }
        .row-form {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .small-input {
            min-width: 170px;
        }
    </style>
</head>
<body>
<div class="container">
    <section class="card">
        <h1>Администраторски Панел</h1>
        <p>Управление на потребители: създаване, изтриване, смяна на парола и смяна на роля.</p>
    </section>

    <section class="card">
        <div class="msg msg-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="msg msg-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <h2>Създаване на потребител</h2>
        <form method="post" action="/users">
            <div class="form-grid">
                <input type="text" name="username" placeholder="Username" required>
                <input type="text" name="name" placeholder="Име" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Парола (мин. 6)" required>
                <select name="role">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="MODERATOR">MODERATOR</option>
                    <option value="GUEST">GUEST</option>
                </select>
                <button class="btn-primary" type="submit">Създай</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Потребители</h2>
        <table class="table" th:if="${!#lists.isEmpty(users)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Име</th>
                <th>Email</th>
                <th>Роля</th>
                <th>Парола</th>
                <th>Изтриване</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">user</td>
                <td th:text="${user.name}">Name</td>
                <td th:text="${user.email}">email@mail.com</td>
                <td>
                    <form th:action="@{'/users/' + ${user.id} + '/role'}" method="post" class="row-form">
                        <select name="role">
                            <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                            <option value="MODERATOR" th:selected="${user.role == 'MODERATOR'}">MODERATOR</option>
                            <option value="GUEST" th:selected="${user.role == 'GUEST'}">GUEST</option>
                        </select>
                        <button class="btn-primary" type="submit">Запази</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{'/users/' + ${user.id} + '/password'}" method="post" class="row-form">
                        <input class="small-input" type="password" name="password" placeholder="Нова парола" required>
                        <button class="btn-primary" type="submit">Смени</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{'/users/' + ${user.id} + '/delete'}" method="post">
                        <button class="btn-danger" type="submit">Изтрий</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(users)}">Няма потребители в таблицата users.</p>
    </section>
</div>
</body>
</html>
