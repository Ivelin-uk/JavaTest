spring.application.name=hello-world-spring
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5500}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:System Admin}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin12345}
