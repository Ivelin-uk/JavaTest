<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World MVC</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #f4f6fb, #dfe8ff);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            padding: 2.5rem 3rem;
            border-radius: 1rem;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(24, 39, 75, 0.15);
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #1f2a44;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${message}">Hello World</h1>
</div>
</body>
</html>
