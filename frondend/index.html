<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Manager Frontend</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="layout">
    <header class="hero">
        <p class="badge">Frontend MVC</p>
        <h1>Управление на роли</h1>
        <p class="subtitle">
            Самостоятелен frontend за редакция на роли в таблица <strong>users</strong>.
        </p>
    </header>

    <section class="panel">
        <div class="panel-title">
            <h2>Потребители и роли</h2>
            <button id="reload-btn" class="btn btn-ghost" type="button">Обнови</button>
        </div>
        <p id="message" class="message" hidden></p>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Потребител</th>
                    <th>Роля</th>
                </tr>
                </thead>
                <tbody id="users-body"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="./app.js"></script>
</body>
</html>
